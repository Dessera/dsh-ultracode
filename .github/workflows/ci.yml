# Continuous integration.
#
# `check` runs the repository's own gate on both Node.js lines the package
# declares: format checking, lint, type checking, build and tests.
#
# The gate reads the harness installation the machine already has, so a checkout
# that carries only this plugin reports the tests that need one as skips.

name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

# A newer run for the same branch replaces an older one instead of queueing
# behind it.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: Node.js ${{ matrix.node }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ["22.x", "24.x"]
        steps:
            - uses: actions/checkout@v7

            # Reads the pnpm version from `packageManager`, so the workflow and a
            # checkout install with the same one.
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run the gate
              run: pnpm check
