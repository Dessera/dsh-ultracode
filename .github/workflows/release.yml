# Release.
#
# A tag is the release authority: `vX.Y.Z` names the commit that was built, and the
# registry never lets that version be replaced. This workflow turns a tag into the
# two records a release owes — the package on npm, and a GitHub Release that says
# what that package was built and tested against — so that neither one is written
# by hand.
#
# Pushing a `vX.Y.Z` tag runs it. It can also be started by hand with a tag as its
# input, for three cases: writing the Release of a tag that shipped before this
# workflow existed, reading the registry again after a staged release was approved,
# and a run that publishes nothing because the version is already there.
#
# Publishing goes through the registry's staging queue rather than straight to the
# registry. This workflow runs the gate, packs the tarball and stages it, and a
# maintainer then approves that stage with a second factor, either on npmjs.com or
# with `npm stage approve <stage-id>`. Direct publishing is not what this
# repository's trusted publisher allows — a run that calls `npm publish` is refused
# with `OIDC permission denied for this action`, because a trusted publisher
# registered after September 2026 allows the staged action unless direct publishing
# is switched on as well.
#
# Staging puts nothing in the registry index, so the run that stages a version
# cannot read its tarball integrity back. Run this workflow once more for the same
# tag with `publish` left false after approving it: that run publishes nothing and
# the Release picks up the integrity line.
#
# The repository stores no publishing token. The run authenticates through the
# trusted publisher registered on npm, which is why the release job asks for
# `id-token: write`, and every publish carries a provenance attestation. A hand
# publish from a laptop carries none, because npm issues those only to a supported
# workflow.

name: Release

on:
    push:
        # Release tags only. A push to a branch is what the continuous integration
        # workflow answers.
        tags: ["v*.*.*"]
    workflow_dispatch:
        inputs:
            tag:
                description: The existing tag to release from, for example v0.1.2
                required: true
                type: string
            publish:
                description: Publish to npm when this version is not on the registry yet
                required: false
                default: false
                type: boolean
            distTag:
                description: The npm dist-tag to publish under; empty picks latest or next from the version
                required: false
                default: ""
                type: string

# Reads everywhere; the one job that writes repository contents asks for that
# separately, so the permission is visible next to the steps that use it.
permissions:
    contents: read

# A release is never cancelled halfway through, so this group never cancels. The
# group is named after the tag from either trigger, so two runs for the same tag
# queue behind each other instead of racing, and two runs for different tags do not
# block each other.
concurrency:
    group: release-${{ inputs.tag || github.ref_name }}
    cancel-in-progress: false

jobs:
    plan:
        name: Verify the tag
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.verify.outputs.tag }}
            name: ${{ steps.verify.outputs.name }}
            version: ${{ steps.verify.outputs.version }}
            sha: ${{ steps.verify.outputs.sha }}
            published: ${{ steps.verify.outputs.published }}
            previous: ${{ steps.verify.outputs.previous }}
            newest: ${{ steps.verify.outputs.newest }}
        steps:
            - uses: actions/checkout@v7
              with:
                  # The ancestry check, the previous tag and the newest tag all need
                  # the history and the tags, which a shallow checkout does not carry.
                  fetch-depth: 0

            # The plan reads two other release tags — the one before this release,
            # for the compare link, and the newest one, which decides the Latest
            # flag. The checkout provides them today, but nothing here should depend
            # on an action's default: fetching them keeps the requirement explicit.
            - name: Fetch the release tags
              run: git fetch --tags --force --quiet

            - uses: actions/setup-node@v7
              with:
                  node-version: "24.x"
                  # A release reads nothing out of a cache a normal run wrote.
                  package-manager-cache: false

            # Four things decide whether a run may touch anything at all: the tag
            # exists, it names the version the tree carries, it points at a commit
            # this repository released from, and the notes know which release came
            # before it. The registry lookup in the same step is what tells the
            # publishing path whether there is anything left to do.
            - name: Verify the tag, and read what the registry already has
              id: verify
              env:
                  # The tag comes from the pushed ref on a tag push, and from the
                  # input on a manual run.
                  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
                  TAGGED: ${{ runner.temp }}/tagged-package.json
              run: |
                  set -euo pipefail

                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
                      echo "::error::$TAG is not a release tag of the form vX.Y.Z"
                      exit 1
                  fi
                  if ! git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null; then
                      echo "::error::this repository carries no tag named $TAG"
                      exit 1
                  fi

                  git show "$TAG:package.json" > "$TAGGED"
                  name="$(node -p "JSON.parse(require('node:fs').readFileSync(process.env.TAGGED, 'utf8')).name")"
                  version="${TAG#v}"
                  declared="$(node -p "JSON.parse(require('node:fs').readFileSync(process.env.TAGGED, 'utf8')).version")"
                  if [ "$declared" != "$version" ]; then
                      echo "::error::$TAG names $version, but package.json at that tag says $declared"
                      exit 1
                  fi

                  sha="$(git rev-list -n 1 "$TAG")"
                  if ! git merge-base --is-ancestor "$sha" origin/main; then
                      echo "::error::$sha is not an ancestor of origin/main, so $TAG does not name a commit this repository released from"
                      exit 1
                  fi

                  if npm view "$name@$version" version > /dev/null 2>&1; then
                      published=true
                  else
                      published=false
                  fi

                  previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)"
                  # Which release GitHub labels "Latest" is decided by when a release
                  # is created rather than by its version, so the flag has to be set
                  # explicitly: backfilling older tags after a newer one exists would
                  # otherwise relabel the older tag as latest.
                  newest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"

                  {
                      echo "tag=$TAG"
                      echo "name=$name"
                      echo "version=$version"
                      echo "sha=$sha"
                      echo "published=$published"
                      echo "previous=$previous"
                      echo "newest=$newest"
                  } >> "$GITHUB_OUTPUT"

    release:
        name: Write the release
        needs: plan
        runs-on: ubuntu-latest
        permissions:
            # Creating the Release and uploading its assets is one write. The other
            # is the OIDC token the registry exchanges for a short-lived publishing
            # token, which is what lets a publish carry its provenance attestation.
            contents: write
            id-token: write
        env:
            TAG: ${{ needs.plan.outputs.tag }}
            NAME: ${{ needs.plan.outputs.name }}
            VERSION: ${{ needs.plan.outputs.version }}
        steps:
            # Two checkouts, because the generator and the facts live in different
            # commits. The generator belongs to the commit this workflow runs from,
            # and the facts belong to the tag: a tag that shipped before the
            # generator existed still gets its Release written by today's generator.
            - name: Check out the commit this workflow runs from
              uses: actions/checkout@v7

            - name: Check out the tagged tree
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.plan.outputs.tag }}
                  path: tree

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: "24.x"
                  cache: pnpm
                  cache-dependency-path: |
                      package.json
                      tree/pnpm-lock.yaml

            # The generator reads the supported versions through `compat/plan.mjs`,
            # which imports `semver`, so a run needs this repository's dependencies
            # even when it publishes nothing. It is installed here, in the tree the
            # generator comes from, and `--ignore-scripts` keeps the build out of it:
            # the artifacts this run publishes are built in `tree/` below.
            - name: Install the dependencies the generator reads
              run: pnpm install --ignore-scripts --frozen-lockfile

            - name: Decide what this run does
              id: decide
              env:
                  PUBLISHED: ${{ needs.plan.outputs.published }}
                  REQUESTED: ${{ github.event_name == 'push' || inputs.publish }}
              run: |
                  set -euo pipefail
                  if [ "$PUBLISHED" = "true" ]; then
                      echo "::notice::$NAME@$VERSION is already on the registry, so this run only writes the Release"
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                  elif [ "$REQUESTED" = "true" ]; then
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::$NAME@$VERSION is not on the registry, and this run was not asked to publish it"
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                  fi

            # The gate is what a publish owes the people who install it, so it runs
            # only when something is about to be published. The compatibility matrix
            # is the claim the Release makes, which is why it runs here rather than
            # relying on a continuous integration run that a tag does not trigger.
            #
            # The harness the gate reads is provisioned in its own step, and the gate
            # names it through that step's output. A `$GITHUB_ENV` write would not do:
            # those variables reach the steps that follow, not the one that wrote
            # them, so the gate would run with no `DSH_HOME` and fail on a probe that
            # looks for a harness it cannot find.
            - name: Install the tagged tree
              if: steps.decide.outputs.publish == 'true'
              working-directory: tree
              run: pnpm install --frozen-lockfile

            - name: Provision the oldest supported harness
              id: provision
              if: steps.decide.outputs.publish == 'true'
              working-directory: tree
              env:
                  DSH_COMPAT_CACHE: ${{ runner.temp }}/dsh-compat
              run: |
                  set -euo pipefail
                  pinned="$(node -e "import('./compat/plan.mjs').then(m => process.stdout.write(m.matrixOf(m.readPlan())[0]))")"
                  echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
                  node scripts/compat.mjs --version "$pinned"

            - name: Run the gate
              if: steps.decide.outputs.publish == 'true'
              working-directory: tree
              env:
                  DSH_COMPAT_CACHE: ${{ runner.temp }}/dsh-compat
                  DSH_HOME: ${{ runner.temp }}/dsh-compat/${{ steps.provision.outputs.pinned }}
                  DSH_EXPECT_HARNESS_VERSION: ${{ steps.provision.outputs.pinned }}
              run: pnpm check

            - name: Run the compatibility matrix this release claims
              if: steps.decide.outputs.publish == 'true'
              working-directory: tree
              env:
                  DSH_COMPAT_CACHE: ${{ runner.temp }}/dsh-compat
              run: node scripts/compat.mjs --type --update

            - name: Build and pack the tarball that will be published
              if: steps.decide.outputs.publish == 'true'
              id: pack
              working-directory: tree
              run: |
                  set -euo pipefail
                  # `--ignore-scripts`: without it `npm pack` runs `prepare`, which
                  # builds the artifacts a second time, and the gate above has
                  # already built them. Packing is all this step needs to do.
                  pnpm build
                  npm pack --ignore-scripts
                  tgz="$(ls ./*.tgz)"
                  sha512="$(node -e 'const c = require("node:crypto"), f = require("node:fs"); process.stdout.write(c.createHash("sha512").update(f.readFileSync(process.argv[1])).digest("base64"))' "$tgz")"
                  {
                      echo "path=$PWD/$tgz"
                      echo "sha512=$sha512"
                  } >> "$GITHUB_OUTPUT"

            - name: Stage the tarball for publishing
              if: steps.decide.outputs.publish == 'true'
              id: stage
              working-directory: tree
              env:
                  TGZ: ${{ steps.pack.outputs.path }}
                  DIST_TAG: ${{ inputs.distTag }}
              run: |
                  set -euo pipefail
                  tag="$DIST_TAG"
                  if [ -z "$tag" ]; then
                      case "$VERSION" in
                          *-*) tag=next ;;
                          *) tag=latest ;;
                      esac
                  fi
                  echo "::notice::staging $NAME@$VERSION under the $tag dist-tag"
                  # The stage id is what a maintainer approves, and it is printed
                  # rather than returned in a machine-readable field, so the whole
                  # output goes to the summary as well as the log.
                  npm stage publish "$TGZ" --tag "$tag" 2>&1 | tee "$RUNNER_TEMP/stage.log"
                  {
                      echo "### Staged for approval"
                      echo
                      echo '```'
                      cat "$RUNNER_TEMP/stage.log"
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            # What the registry serves is the one fact a release note cannot
            # restate: it is read back from the registry. It is empty while the
            # version is only staged, because staging does not put anything in the
            # registry index, and the comparison therefore happens only once the
            # version is really there: a re-run after the approval records the
            # integrity, and a mismatch between the bytes the registry serves and
            # the bytes this workflow built fails the run that reads them.
            - name: Read what the registry serves for this version
              id: registry
              run: |
                  set -euo pipefail
                  integrity="$(npm view "$NAME@$VERSION" dist.integrity 2>/dev/null || true)"
                  echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
                  if [ -n "$integrity" ] && [ "${{ steps.decide.outputs.publish }}" = "true" ]; then
                      built="sha512-${{ steps.pack.outputs.sha512 }}"
                      if [ "$integrity" != "$built" ]; then
                          echo "::error::the registry serves $integrity, but this run built $built"
                          exit 1
                      fi
                  fi

            - name: Write the release notes
              id: notes
              run: |
                  set -euo pipefail
                  node scripts/release-notes.mjs \
                      --root tree \
                      --tag "$TAG" \
                      --sha "${{ needs.plan.outputs.sha }}" \
                      --previous "${{ needs.plan.outputs.previous }}" \
                      --integrity "${{ steps.registry.outputs.integrity }}" \
                      > "$RUNNER_TEMP/notes.md"
                  cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

            - name: Create or update the Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  if [ "${{ needs.plan.outputs.newest }}" = "$TAG" ]; then
                      latest=(--latest)
                  else
                      latest=(--latest=false)
                  fi
                  # A prerelease is marked as one so that it is never the release a
                  # visitor is pointed at; GitHub labels no prerelease "Latest".
                  flags=("${latest[@]}")
                  case "$VERSION" in
                      *-*) flags+=(--prerelease) ;;
                  esac
                  if gh release view "$TAG" > /dev/null 2>&1; then
                      gh release edit "$TAG" "${flags[@]}" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
                  else
                      gh release create "$TAG" "${flags[@]}" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
                  fi

            # The report and the tarball are attached only when this run produced
            # them: a run that published nothing has no tarball of its own, and
            # attaching something else under that name would misstate what the
            # registry serves.
            - name: Attach the run's report and tarball
              env:
                  GH_TOKEN: ${{ github.token }}
                  TGZ: ${{ steps.pack.outputs.path }}
              run: |
                  set -euo pipefail
                  assets=()
                  if [ -f tree/compat/matrix.json ]; then
                      cp tree/compat/matrix.json "$RUNNER_TEMP/compat-matrix.json"
                      assets+=("$RUNNER_TEMP/compat-matrix.json")
                  fi
                  if [ -n "$TGZ" ] && [ -f "$TGZ" ]; then
                      assets+=("$TGZ")
                  fi
                  if [ ${#assets[@]} -gt 0 ]; then
                      gh release upload "$TAG" "${assets[@]}" --clobber
                  else
                      echo "::notice::this run built nothing to attach, because it published nothing"
                  fi
